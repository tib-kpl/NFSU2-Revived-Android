plugins { id 'com.android.application' }
android {
    namespace 'io.mininxd.nfsu2'
    compileSdk 35
    defaultConfig {
        applicationId 'io.mininxd.nfsu2'
        minSdk 28
        targetSdk 35
        // CI overrides these with -PversionCode / -PversionName.
        versionCode (project.findProperty('versionCode') ?: '89').toInteger()
        versionName project.findProperty('versionName') ?: '0.15.25.beta8'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        // Keystore comes from CI secrets (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            // Without a keystore (local build, forks) fall back to the debug key.
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    // adrenotools opens its namespace hook libraries by path from nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
}
